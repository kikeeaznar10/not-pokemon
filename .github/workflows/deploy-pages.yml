# Publishes the game to GitHub Pages when the `pages` branch is pushed (release: push main's commit to `pages`).
# Pushes to any other branch do not run it. See docs/DEPLOY.md for the one-time setup.
name: Deploy to GitHub Pages

on:
  push:
    branches: [pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a newer push waits for the one in progress (never cancels it).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # A manual run from the Actions tab also deploys only when started on `pages`.
    if: github.ref == 'refs/heads/pages'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Typecheck + sprite atlas + production build (no VITE_E2E: no test hooks on the public site).
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
