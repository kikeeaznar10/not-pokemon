<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <title>Flexymon</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      #game {
        width: 100%;
        height: 100%;
      }
      canvas {
        image-rendering: pixelated;
      }
      /* Touch controls (src/ui/touch-controls.ts): semi-transparent, every target >= 48 CSS px. */
      .touch-controls {
        position: fixed;
        inset: 0;
        z-index: 10;
        pointer-events: none;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
        font-family: monospace;
        font-weight: bold;
        color: rgba(255, 255, 255, 0.85);
      }
      .tc-dpad,
      .tc-button {
        position: absolute;
        pointer-events: auto;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      .tc-dpad {
        left: calc(12px + env(safe-area-inset-left));
        bottom: calc(12px + env(safe-area-inset-bottom));
        width: 156px;
        height: 156px;
      }
      .tc-arm {
        position: absolute;
        width: 52px;
        height: 52px;
        box-sizing: border-box;
        background: rgba(255, 255, 255, 0.22);
        border: 2px solid rgba(255, 255, 255, 0.45);
      }
      .tc-arm::after {
        content: '';
        position: absolute;
        left: 50%;
        top: 50%;
        border: 9px solid transparent;
      }
      .tc-arm-up {
        left: 52px;
        top: 0;
        border-radius: 10px 10px 0 0;
      }
      .tc-arm-up::after {
        border-bottom-color: rgba(255, 255, 255, 0.8);
        transform: translate(-50%, -75%);
      }
      .tc-arm-down {
        left: 52px;
        top: 104px;
        border-radius: 0 0 10px 10px;
      }
      .tc-arm-down::after {
        border-top-color: rgba(255, 255, 255, 0.8);
        transform: translate(-50%, -25%);
      }
      .tc-arm-left {
        left: 0;
        top: 52px;
        border-radius: 10px 0 0 10px;
      }
      .tc-arm-left::after {
        border-right-color: rgba(255, 255, 255, 0.8);
        transform: translate(-75%, -50%);
      }
      .tc-arm-right {
        left: 104px;
        top: 52px;
        border-radius: 0 10px 10px 0;
      }
      .tc-arm-right::after {
        border-left-color: rgba(255, 255, 255, 0.8);
        transform: translate(-25%, -50%);
      }
      .tc-button {
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        background: rgba(255, 255, 255, 0.22);
        border: 2px solid rgba(255, 255, 255, 0.45);
      }
      .tc-a,
      .tc-b {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        font-size: 22px;
      }
      .tc-a {
        right: calc(16px + env(safe-area-inset-right));
        bottom: calc(64px + env(safe-area-inset-bottom));
      }
      .tc-b {
        right: calc(92px + env(safe-area-inset-right));
        bottom: calc(16px + env(safe-area-inset-bottom));
      }
      .tc-start,
      .tc-map {
        top: calc(8px + env(safe-area-inset-top));
        width: 76px;
        height: 48px;
        border-radius: 24px;
        font-size: 13px;
      }
      .tc-start {
        right: calc(12px + env(safe-area-inset-right));
      }
      .tc-map {
        right: calc(96px + env(safe-area-inset-right));
      }
      .tc-down,
      .tc-arm.tc-down {
        background: rgba(255, 255, 255, 0.55);
      }
      /* Portrait guard (src/ui/rotate-screen.ts). */
      .rotate-screen {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #000;
        color: #f8f8f0;
        font-family: monospace;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      .rotate-screen.rotate-shown {
        display: flex;
      }
      .rotate-phone {
        width: 44px;
        height: 76px;
        border: 4px solid #f8f8f0;
        border-radius: 8px;
        animation: rotate-phone 2s ease-in-out infinite;
      }
      @keyframes rotate-phone {
        0%,
        30% {
          transform: rotate(0deg);
        }
        60%,
        100% {
          transform: rotate(-90deg);
        }
      }
      .rotate-title {
        font-size: 24px;
        font-weight: bold;
      }
      .rotate-hint {
        font-size: 14px;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
